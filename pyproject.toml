[project]
name = "vantra-ai"
version = "0.3.0"
description = "MVP académico reproducible de agente bancario ficticio con interfaz Gradio"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "gradio>=5.15,<7",
  "anthropic>=0.49,<2",
  "requests>=2.31,<3",
  "azure-cognitiveservices-speech>=1.40,<2",
  "python-dotenv>=1.0,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "websockets>=14,<17",
  "python-multipart>=0.0.9,<1",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.12,<1",
  "pre-commit>=4,<5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["src", "app"]
branch = true

[tool.coverage.report]
show_missing = true
omit = ["tests/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "results", "build", "dist"]

[tool.ruff.lint]
# Reglas de error y nombres críticos activas desde el primer commit.
# Incrementar el conjunto tras normalizar estilo del código legado.
select = ["E4", "E9", "F63", "F7", "F82"]
ignore = ["E401", "E402"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["B017"]
