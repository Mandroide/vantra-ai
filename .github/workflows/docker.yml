name: Docker · construcción manual

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Construir sin publicar la imagen
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: vantra-ai:manual
