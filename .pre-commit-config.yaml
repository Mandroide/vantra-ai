# Hooks locales; instalar con: uv run pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint con correcciones automáticas
        entry: uv run --no-sync ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format
        entry: uv run --no-sync ruff format
        language: system
        types_or: [python, pyi]
      - id: vantra-secret-check
        name: Validación adicional de secretos y artefactos sensibles
        entry: uv run --no-sync python scripts/check_secrets.py
        language: system
        pass_filenames: false
        always_run: true
